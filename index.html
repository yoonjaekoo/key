<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADOFAI 16K Key Viewer</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#080808;
  --main:#ff6a00;
  --m10:rgba(255,106,0,.10);
  --m20:rgba(255,106,0,.20);
  --m30:rgba(255,106,0,.30);
  --m40:rgba(255,106,0,.40);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--main);
  font-family:'JetBrains Mono', monospace;
  user-select:none;
}

body{
  display:flex;
  flex-direction:column;
}

/* HUD */

#hud{
  height:72px;
  flex-shrink:0;
  border-bottom:1px solid var(--m20);

  display:flex;
  align-items:center;
  justify-content:center;
  gap:48px;

  position:relative;
}

.stat{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.stat-lbl{
  font-size:8px;
  opacity:.5;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.stat-val{
  font-family:'Bebas Neue', sans-serif;
  font-size:34px;
  line-height:1;
}

#s-kps{
  font-size:48px;
}

#kps-bar-wrap{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:2px;
  background:var(--m10);
}

#kps-bar{
  width:0%;
  height:100%;
  background:var(--main);
}

/* CANVAS */

#wrap{
  flex:1;
  overflow:hidden;
  position:relative;
  display:flex;
  justify-content:center;
}

canvas{
  display:block;
}

/* CONTROL */

#ctrl{
  height:56px;
  flex-shrink:0;

  border-top:1px solid var(--m20);

  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
}

.label{
  font-size:8px;
  letter-spacing:.15em;
  opacity:.5;
  text-transform:uppercase;
}

.val{
  font-family:'Bebas Neue', sans-serif;
  font-size:22px;
  min-width:40px;
  text-align:right;
}

.sep{
  width:1px;
  height:22px;
  background:var(--m20);
}

button{
  background:transparent;
  border:1px solid var(--m40);
  color:var(--main);

  padding:4px 10px;

  cursor:pointer;

  font-size:9px;
  font-family:'JetBrains Mono', monospace;

  letter-spacing:.1em;
  text-transform:uppercase;
}

button:hover{
  background:var(--m10);
}

button.active{
  background:var(--m20);
  border-color:var(--main);
}

input[type=range]{
  width:120px;
}

</style>
</head>
<body>

<div id="hud">

  <div class="stat">
    <span class="stat-lbl">KPS</span>
    <span class="stat-val" id="s-kps">0</span>
  </div>

  <div class="stat">
    <span class="stat-lbl">MAX</span>
    <span class="stat-val" id="s-max">0</span>
  </div>

  <div class="stat">
    <span class="stat-lbl">TOTAL</span>
    <span class="stat-val" id="s-total">0</span>
  </div>

  <div id="kps-bar-wrap">
    <div id="kps-bar"></div>
  </div>

</div>

<div id="wrap">
  <canvas id="cv"></canvas>
</div>

<div id="ctrl">

  <span class="label">Speed</span>

  <input type="range"
         id="speed"
         min="0.5"
         max="20"
         step="0.1"
         value="3.0">

  <span class="val" id="speed-val">3.0</span>

  <div class="sep"></div>

  <button id="rise" class="active">Rise</button>
  <button id="fall">Fall</button>

</div>

<script>

/* =========================================================
   16K LAYOUT
========================================================= */

const KEYS = [

  { code:'Tab',        lbl:'⇥' },
  { code:'KeyQ',       lbl:'Q' },
  { code:'KeyW',       lbl:'W' },
  { code:'KeyE',       lbl:'E' },

  { code:'CapsLock',   lbl:'⇪' },
  { code:'KeyA',       lbl:'A' },
  { code:'KeyS',       lbl:'S' },
  { code:'KeyD',       lbl:'D' },

  { code:'ShiftLeft',  lbl:'⇧' },
  { code:'KeyZ',       lbl:'Z' },
  { code:'KeyX',       lbl:'X' },
  { code:'KeyC',       lbl:'C' },

  { code:'Digit1',     lbl:'1' },
  { code:'Digit2',     lbl:'2' },
  { code:'Digit3',     lbl:'3' },
  { code:'Backspace',  lbl:'⌫' },

];

const N = KEYS.length;

const ORANGE = '#ff6a00';

const CAP_H = 48;
const PAD = 6;

const MAX_PARTICLES = 6;

/* =========================================================
   STATE
========================================================= */

let speedMult = 3.0;
let dirUp = true;

const lanes = Array.from({length:N}, ()=>[]);
const particles = Array.from({length:N}, ()=>[]);

const held = new Uint8Array(N);
const lastHit = new Float64Array(N);

let totalHits = 0;
let maxKps = 0;

const hitBuffer = [];
const pulseAt = new Float64Array(N);

/* =========================================================
   CANVAS
========================================================= */

const wrap = document.getElementById('wrap');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

let W = 0;
let H = 0;
let LW = 0;

function resize(){

  H = wrap.clientHeight;

  LW = Math.min(
    90,
    Math.max(
      42,
      Math.floor(wrap.clientWidth / N)
    )
  );

  W = LW * N;

  cv.width = W;
  cv.height = H;
}

resize();

new ResizeObserver(resize).observe(wrap);

/* =========================================================
   HIT LINE
========================================================= */

function hitY(){

  return dirUp
    ? H - CAP_H - PAD
    : CAP_H + PAD;
}

/* =========================================================
   KEYMAP
========================================================= */

const codeMap = {};

KEYS.forEach((k,i)=>{
  codeMap[k.code] = i;
});

/* =========================================================
   INPUT
========================================================= */

window.addEventListener('keydown', e=>{

  if(e.code in codeMap){
    e.preventDefault();
  }

}, true);

document.addEventListener('keydown', e=>{

  const i = codeMap[e.code];

  if(i === undefined) return;

  e.preventDefault();

  held[i] = 1;

}, false);

document.addEventListener('keyup', e=>{

  const i = codeMap[e.code];

  if(i === undefined) return;

  e.preventDefault();

  held[i] = 0;

  closeSegment(i);

}, false);

/* =========================================================
   SEGMENTS
========================================================= */

function pressLane(i){

  const now = performance.now();

  hitBuffer.push(now);

  totalHits++;

  pulseAt[i] = now;

  document.getElementById('s-total').textContent = totalHits;

  const hy = hitY();

  lanes[i].push({
    headY:hy,
    tailY:hy,
    closed:false
  });

  spawnParticles(i, hy);
}

function closeSegment(i){

  const arr = lanes[i];

  for(let j=arr.length-1; j>=0; j--){

    if(!arr[j].closed){

      arr[j].closed = true;
      return;
    }
  }
}

/* =========================================================
   PARTICLES
========================================================= */

function spawnParticles(lane, hy){

  const arr = particles[lane];

  const cx = lane * LW + LW * .5;

  const dir = dirUp ? -1 : 1;

  for(let i=0; i<MAX_PARTICLES; i++){

    const a =
      Math.PI *
      (0.2 + Math.random()*0.6) *
      dir +
      (dir < 0 ? 0 : Math.PI);

    const sp = 1 + Math.random()*2.2;

    arr.push({

      x:cx,
      y:hy,

      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp,

      life:1,

      decay:.04 + Math.random()*.04,

      r:1 + Math.random()*2
    });
  }
}

/* =========================================================
   KPS
========================================================= */

const sKps = document.getElementById('s-kps');
const sMax = document.getElementById('s-max');
const kpBar = document.getElementById('kps-bar');

function updateKps(){

  const now = performance.now();

  const cut = now - 1000;

  while(hitBuffer.length && hitBuffer[0] < cut){
    hitBuffer.shift();
  }

  const kps = hitBuffer.length;

  if(kps > maxKps){

    maxKps = kps;
    sMax.textContent = maxKps;
  }

  sKps.textContent = kps;

  kpBar.style.width =
    Math.min(
      100,
      (kps / Math.max(maxKps,1)) * 100
    ) + '%';
}

/* =========================================================
   RENDER
========================================================= */

let lastFrame = 0;

function frame(ts){

  requestAnimationFrame(frame);

  const dt = Math.min(ts - lastFrame, 32);

  lastFrame = ts;

  const now = performance.now();

  /* ======================================
     NKRO + 동타 처리
  ====================================== */

  for(let i=0; i<N; i++){

    if(held[i]){

      if(now - lastHit[i] > 16){

        lastHit[i] = now;

        pressLane(i);
      }
    }
  }

  updateKps();

  ctx.fillStyle = '#080808';
  ctx.fillRect(0,0,W,H);

  const hy = hitY();

  const pxPerMs = speedMult * .18;

  /* dividers */

  ctx.strokeStyle = 'rgba(255,106,0,.08)';
  ctx.lineWidth = 1;

  for(let i=1; i<N; i++){

    const x = i * LW;

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  /* hitline */

  ctx.strokeStyle = 'rgba(255,106,0,.25)';

  ctx.beginPath();
  ctx.moveTo(0,hy);
  ctx.lineTo(W,hy);
  ctx.stroke();

  /* notes */

  ctx.fillStyle = ORANGE;

  for(let i=0; i<N; i++){

    const laneX = i * LW;

    const segs = lanes[i];

    for(let j=segs.length-1; j>=0; j--){

      const s = segs[j];

      const scroll = pxPerMs * dt;

      if(!s.closed){

        if(dirUp){
          s.headY -= scroll;
        }else{
          s.headY += scroll;
        }

        s.tailY = hy;

      }else{

        if(dirUp){

          s.headY -= scroll;
          s.tailY -= scroll;

        }else{

          s.headY += scroll;
          s.tailY += scroll;
        }
      }

      let top;
      let bottom;

      if(dirUp){

        top = s.headY;
        bottom = s.tailY;

      }else{

        top = s.tailY;
        bottom = s.headY;
      }

      if(dirUp && bottom < 0){

        segs.splice(j,1);
        continue;
      }

      if(!dirUp && top > H){

        segs.splice(j,1);
        continue;
      }

      const drawTop = Math.max(top,0);
      const drawBottom = Math.min(bottom,H);

      const rh = drawBottom - drawTop;

      if(rh > 0){

        ctx.fillRect(
          laneX,
          drawTop,
          LW,
          rh
        );
      }
    }
  }

  /* particles */

  for(let i=0; i<N; i++){

    const arr = particles[i];

    for(let j=arr.length-1; j>=0; j--){

      const p = arr[j];

      p.x += p.vx;
      p.y += p.vy;

      p.vy += dirUp ? -.03 : .03;

      p.life -= p.decay;

      if(p.life <= 0){

        arr.splice(j,1);
        continue;
      }

      ctx.fillStyle =
        `rgba(255,106,0,${p.life})`;

      ctx.fillRect(
        p.x,
        p.y,
        p.r,
        p.r
      );
    }
  }

  /* caps */

  for(let i=0; i<N; i++){

    drawCap(i, ts);
  }
}

requestAnimationFrame(frame);

/* =========================================================
   CAP
========================================================= */

function drawCap(i, ts){

  const x = i * LW;

  const y = dirUp
    ? H - CAP_H
    : 0;

  const active = held[i];

  ctx.fillStyle = active
    ? 'rgba(255,106,0,.28)'
    : 'rgba(255,106,0,.08)';

  ctx.fillRect(
    x,
    y,
    LW,
    CAP_H
  );

  ctx.strokeStyle = active
    ? ORANGE
    : 'rgba(255,106,0,.25)';

  ctx.lineWidth = active ? 2 : 1;

  ctx.strokeRect(
    x + .5,
    y + .5,
    LW - 1,
    CAP_H - 1
  );

  /* pulse */

  const elapsed = ts - pulseAt[i];

  if(elapsed < 220){

    const t = elapsed / 220;

    const ex = t * 8;

    ctx.strokeStyle =
      `rgba(255,106,0,${(1-t)*.5})`;

    ctx.strokeRect(
      x - ex,
      y - ex,
      LW + ex*2,
      CAP_H + ex*2
    );
  }

  /* label */

  ctx.fillStyle = active
    ? ORANGE
    : 'rgba(255,106,0,.5)';

  ctx.font =
    `${active ? 700 : 400} ${Math.round(LW*.25)}px 'JetBrains Mono'`;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillText(
    KEYS[i].lbl,
    x + LW*.5,
    y + CAP_H*.5
  );
}

/* =========================================================
   CONTROLS
========================================================= */

const speed = document.getElementById('speed');
const speedVal = document.getElementById('speed-val');

speed.addEventListener('input', ()=>{

  speedMult = parseFloat(speed.value);

  speedVal.textContent =
    speedMult.toFixed(1);
});

document.getElementById('rise')
.addEventListener('click', ()=>{

  dirUp = true;

  document.getElementById('rise')
    .classList.add('active');

  document.getElementById('fall')
    .classList.remove('active');
});

document.getElementById('fall')
.addEventListener('click', ()=>{

  dirUp = false;

  document.getElementById('fall')
    .classList.add('active');

  document.getElementById('rise')
    .classList.remove('active');
});

</script>
</body>
</html>

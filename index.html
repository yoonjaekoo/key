<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADOFAI Key Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080808;--main:#ff6a00;--m10:rgba(255,106,0,.10);--m20:rgba(255,106,0,.20);--m30:rgba(255,106,0,.30)}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--main);font-family:'JetBrains Mono',monospace;user-select:none}
body{display:flex;flex-direction:column}
#hud{height:72px;border-bottom:1px solid var(--m20);display:flex;align-items:center;justify-content:center;gap:48px;position:relative}
.stat{display:flex;flex-direction:column;align-items:center}.stat-lbl{font-size:8px;opacity:.5;letter-spacing:.2em;text-transform:uppercase}.stat-val{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1}#s-kps{font-size:48px}
#kps-bar-wrap{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--m10)}#kps-bar{width:0%;height:100%;background:var(--main)}
#wrap{flex:1;overflow:hidden;display:flex;justify-content:center}canvas{display:block}
#ctrl{min-height:56px;border-top:1px solid var(--m20);display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:8px 12px}
.label{font-size:8px;opacity:.5;letter-spacing:.15em;text-transform:uppercase}.val{font-family:'Bebas Neue',sans-serif;font-size:22px;min-width:40px;text-align:right}.sep{width:1px;height:22px;background:var(--m20)}
button{background:transparent;border:1px solid var(--m30);color:var(--main);padding:4px 10px;font-family:'JetBrains Mono',monospace;font-size:9px;cursor:pointer}button:hover{background:var(--m10)}button.active{background:var(--m20);border-color:var(--main)}input[type=range]{width:120px}
#key-panel{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);width:min(760px,calc(100vw - 24px));background:#0b0b0b;border:1px solid var(--m30);padding:12px;display:none;z-index:20;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#key-panel.open{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.panel-title{font-family:'Bebas Neue',sans-serif;font-size:24px}.panel-actions{display:flex;gap:8px}
#key-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.key-bind{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.key-bind .slot{font-size:7px;opacity:.45}.key-bind .binding{font-size:13px}.key-bind.listening{background:var(--m20);border-color:var(--main)}
.hint{margin-top:9px;font-size:8px;opacity:.45;text-align:center}
@media(max-width:650px){#key-grid{grid-template-columns:repeat(3,1fr)}#hud{gap:24px}.sep{display:none}}
</style>
</head>
<body>
<div id="hud">
  <div class="stat"><span class="stat-lbl">KPS</span><span class="stat-val" id="s-kps">0</span></div>
  <div class="stat"><span class="stat-lbl">MAX</span><span class="stat-val" id="s-max">0</span></div>
  <div class="stat"><span class="stat-lbl">TOTAL</span><span class="stat-val" id="s-total">0</span></div>
  <div id="kps-bar-wrap"><div id="kps-bar"></div></div>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="ctrl">
  <span class="label">Speed</span>
  <input type="range" id="speed" min="0.5" max="15" step="0.1" value="3.0">
  <span class="val" id="speed-val">3.0</span>
  <div class="sep"></div>
  <button id="rise" class="active">Rise</button>
  <button id="fall">Fall</button>
  <div class="sep"></div>
  <button id="keys-btn">Keys</button>
</div>
<div id="key-panel">
  <div class="panel-head">
    <div class="panel-title">KEY BINDINGS</div>
    <div class="panel-actions"><button id="reset-keys">Reset</button><button id="close-keys">Close</button></div>
  </div>
  <div id="key-grid"></div>
  <div class="hint">키 슬롯을 클릭한 뒤 원하는 키를 누르세요. 설정은 이 브라우저에 저장됩니다.</div>
</div>
<script src="app.js"></script>
</body>
</html>
